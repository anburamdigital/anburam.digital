<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Anburam.Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --purple: #7c3aed;
    --purple-light: #a855f7;
    --text: #e2e8f0;
    --muted: #64748b;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.15) 0%, transparent 60%);
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .logo span { color: var(--purple-light); }
  .subtitle { color: var(--muted); font-size: 0.75rem; margin-bottom: 36px; }
  label { display: block; text-align: left; font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.1em; }
  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 20px;
  }
  input[type="password"]:focus { border-color: var(--purple); }
  button {
    width: 100%;
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: var(--purple-light); }
  button:active { transform: scale(0.98); }
  .error { color: #f87171; font-size: 0.75rem; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">ANBURAM<span>.</span>DIGITAL</div>
  <div class="subtitle">ADMIN PANEL · SECURE ACCESS</div>
  <label for="password">ADMIN PASSWORD</label>
  <input type="password" id="password" placeholder="Enter password" autofocus>
  <button onclick="login()">LOGIN →</button>
  <div class="error" id="error">Wrong password. Try again.</div>
</div>
<script>
  async function login() {
    const password = document.getElementById('password').value;
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/admin';
    } else {
      document.getElementById('error').style.display = 'block';
    }
  }
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
